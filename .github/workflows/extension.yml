name: Release SignalShade Connect
on:
  push:
    tags: ['connect-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:extension
      - run: npm run build
      - run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: signalshade-connect
          path: |
            .artifacts/signalshade-connect.zip
            .artifacts/signalshade-connect.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/connect-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .artifacts/signalshade-connect.zip
          .artifacts/signalshade-connect.sha256
          --title "SignalShade Connect $GITHUB_REF_NAME"
          --latest
          --notes-file extension/RELEASE.md
